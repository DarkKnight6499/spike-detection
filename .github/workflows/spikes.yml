name: spikes
on:
  workflow_dispatch:

# Runs queue instead of overlapping so the alert-state cache stays consistent.
concurrency:
  group: spike-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      # Carries today's already-alerted symbols from run to run (each run saves a new key, restore picks the latest).
      - uses: actions/cache@v4
        with:
          path: alert_state.json
          key: alert-state-${{ github.run_id }}
          restore-keys: alert-state-
      - run: python spike_detector.py poll
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: poll-log-${{ github.run_id }}
          path: poll_alerts_log.csv
          if-no-files-found: ignore
          retention-days: 14
