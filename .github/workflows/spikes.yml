name: spikes
on:
  # GitHub's own schedule is the main starter; the Cloudflare worker is an optional extra.
  # Both UTC offsets are listed; the script exits at once if the market is not about to open.
  schedule:
    - cron: "25 13,14 * * 1-5"
    - cron: "50 18,19 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

# One poller at a time; a queued run starts when the running one ends (jobs are capped at 6h, so the day is two segments).
concurrency:
  group: spike-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      # Carries today's already-alerted symbols between segments (each run saves a new key, restore picks the latest).
      - uses: actions/cache@v4
        with:
          path: alert_state.json
          key: alert-state-${{ github.run_id }}
          restore-keys: alert-state-
      - run: python spike_detector.py poll --loop --until 16:00 --max-minutes 335
        env:
          PYTHONUNBUFFERED: "1"
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Commit alert log
        if: always()
        run: |
          git config user.name "spike-bot"
          git config user.email "spike-bot@users.noreply.github.com"
          git add alerts/poll_alerts.json
          git diff --cached --quiet || (git commit -m "Alerts $(date -u +%FT%TZ)" && git pull --rebase origin main && git push origin main)
